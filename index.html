<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRASM | Login</title>
<link href="assets/vendor/bootstrap-5.3.8/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="assets/vendor/fontawesome-free-7.3.1/css/all.min.css">
</head>
<body class="d-flex flex-column min-vh-100" style="background-color:#eef1f5;">

<div class="w-100" style="background-color:#002d62;">
  <div class="container py-2">
    <div class="d-flex align-items-center flex-wrap">
      <img src="assets/img/logo.webp" alt="Agency Seal" class="me-2" style="width:36px; height:36px; object-fit:contain;">
      <div>
        <div class="text-white small fw-semibold" style="letter-spacing:.5px;">PHILIPPINE STATISTICS AUTHORITY</div>
        <div class="text-white fw-bold" style="font-size:13px; letter-spacing:.5px;">
          CERTIFICATE OF REGISTRATION OF AUTHORITY TO SOLEMNIZE MARRIAGE (CRASM)
        </div>
      </div>
    </div>
  </div>
</div>
<div class="w-100" style="height:5px; background-color:#ffb81c;"></div>

<main class="flex-grow-1 d-flex align-items-center py-4">
<div class="container">
  <div class="row justify-content-center">

    <div class="col-11 col-sm-8 col-md-6 col-lg-5 col-xl-4">
      <div class="card shadow-sm border">
        <div class="card-body p-4 p-md-5">

          <div class="text-center mb-4">
            <h4 class="fw-bold mb-0" style="color:#002d62;">Sign In</h4>
          </div>

          <div class="alert alert-light border small d-none" id="loginError" role="alert">
            <i class="fa-solid fa-circle-exclamation me-1"></i>
            Invalid username or password. Please try again.
          </div>

          <form id="loginForm" novalidate>
            <div class="mb-3">
              <label for="username" class="form-label fw-semibold small">
                Username or Email <span class="text-danger">*</span>
              </label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="fa-solid fa-user"></i></span>
                <input type="text" class="form-control" id="username" placeholder="Enter your username or email" required>
                <div class="invalid-feedback">Username or email is required.</div>
              </div>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label fw-semibold small">
                Password <span class="text-danger">*</span>
              </label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="fa-solid fa-lock"></i></span>
                <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                <button class="btn btn-outline-secondary" type="button" id="togglePassword" tabindex="-1">
                  <i class="fa-solid fa-eye"></i>
                </button>
                <div class="invalid-feedback">Password is required.</div>
              </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="remember">
                <label class="form-check-label small" for="remember">Remember me</label>
              </div>
              <a href="forgot-password.html" class="small text-decoration-none" style="color:#002d62;">Forgot password?</a>
            </div>

            <button type="submit" class="btn w-100 fw-semibold text-white" style="background-color:#002d62;">
              <i class="fa-solid fa-right-to-bracket me-1"></i> Log In
            </button>
          </form>

        </div>
      </div>
    </div>

  </div>
</div>
</main>

<script src="assets/vendor/bootstrap-5.3.8/js/bootstrap.bundle.min.js"></script>
<script>
  document.getElementById('togglePassword').addEventListener('click', function () {
    const pwd = document.getElementById('password');
    const icon = this.querySelector('i');
    const isHidden = pwd.type === 'password';
    pwd.type = isHidden ? 'text' : 'password';
    icon.classList.toggle('fa-eye');
    icon.classList.toggle('fa-eye-slash');
  });

  const form = document.getElementById('loginForm');
  form.addEventListener('submit', function (e) {
    if (!form.checkValidity()) {
      e.preventDefault();
      e.stopPropagation();
    }
    form.classList.add('was-validated');
  });
</script>
</body>
</html>
